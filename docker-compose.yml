# Everything else (playlists, guide, filter, login) is configured in the app under Settings.
services:
  lumen:
    image: ghcr.io/richrdj/lumen:latest
    container_name: lumen
    restart: unless-stopped
    ports:
      - "4040:4040"
    volumes:
      - ./data:/data
    environment:
      TZ: "Europe/Amsterdam"
