<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lumen</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="splash" class="splash">
      <div class="splash-mark"></div>
      <div class="splash-name">Lumen</div>
      <div class="splash-text">&nbsp;</div>
    </div>

    <header class="topbar" id="topbar">
      <a class="brand" href="#/home" tabindex="-1"><span class="brand-mark"></span><span>Lumen</span></a>
      <nav class="tabs" id="tabs">
        <a class="focusable" href="#/home" data-tab="home">Home</a>
        <a class="focusable" href="#/live" data-tab="live">Live TV</a>
        <a class="focusable" href="#/guide" data-tab="guide">Guide</a>
        <a class="focusable" href="#/movies" data-tab="movies">Movies</a>
        <a class="focusable" href="#/series" data-tab="series">Series</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn focusable" id="searchBtn" aria-label="Search (/)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" /></svg>
        </button>
        <button class="icon-btn focusable" id="refreshBtn" aria-label="Refresh playlist">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z" /></svg>
        </button>
        <a class="icon-btn focusable" id="settingsBtn" href="#/settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z" /></svg>
        </a>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div id="search" class="search" hidden>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" /></svg>
        <input class="search-input focusable" type="search" placeholder="Channels, movies, series" autocomplete="off" spellcheck="false" aria-label="Search" />
        <button class="btn btn-glass focusable" data-close-search>Cancel</button>
      </div>
      <div class="search-results"></div>
    </div>

    <div id="sheet" class="sheet" hidden></div>
    <div id="player" class="player" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
